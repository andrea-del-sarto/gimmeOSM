<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>gimmeOSM</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      margin: 20px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    #left {
      flex: 1 1 400px;
      min-width: 350px;
    }
    #map {
      flex: 1 1 400px;
      height: 600px;
      min-width: 350px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    label {
      display: inline-block;
      width: 80px;
    }
    .code-box {
      position: relative;
      margin-top: 1em;
    }
    pre {
      background: #f6f8fa;
      padding: 10px;
      border-radius: 10px;
      overflow: auto;
      max-height: 355px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.9em;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 23px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.8em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .copy-btn:hover {
      background: #0074D9;
      color: #fff;
    }
    #type-info {
      font-weight: 500;
      margin-top: 10px;
      color: #0074D9;
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div id="left">
    <h1>gimmeOSM</h1>
    <p>Inserisci un ID OpenStreetMap (node / way / relation) — il sistema lo riconoscerà automaticamente.</p>

    <div style="margin-top:8px">
      <label for="id">ID</label>
      <input id="id" placeholder="es. 358892" />
      <button id="go">Vai</button>
    </div>

    <div id="type-info"></div>

    <h3>Risultato (GeoJSON)</h3>
    <div class="code-box">
      <button id="copy" class="copy-btn">📋 Copia</button>
      <pre id="out">Nessuna richiesta ancora.</pre>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/osmtogeojson@2.2.12/osmtogeojson.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const OVERPASS_MIRRORS = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.openstreetmap.fr/api/interpreter'
    ];

    const outEl = document.getElementById('out');
    const idEl = document.getElementById('id');
    const go = document.getElementById('go');
    const copyBtn = document.getElementById('copy');
    const typeInfo = document.getElementById('type-info');

    const map = L.map('map').setView([41.9, 12.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    let geoLayer;

    // Costruisce la query Overpass a seconda del tipo
    function buildQuery(type, id){
      if(type === 'node'){
        return `[out:xml][timeout:25];node(${id});out body;`;
      }
      if(type === 'way'){
        return `[out:xml][timeout:25];way(${id});(._;>;);out body;`;
      }
      // relazioni anche annidate
      return `[out:xml][timeout:180];relation(${id});(._;>>;);out body;`;
    }

    // Prova vari mirror Overpass finché non ottiene un XML valido
    async function tryFetchOverpass(query){
      for(const base of OVERPASS_MIRRORS){
        const url = `${base}?data=${encodeURIComponent(query)}`;
        try{
          const resp = await fetch(url, {credentials: 'omit'});
          if(!resp.ok){
            console.warn('Overpass mirror non ok', base, resp.status);
            continue;
          }
          const text = await resp.text();
          const parser = new DOMParser();
          const xml = parser.parseFromString(text, 'text/xml');
          const els = xml.getElementsByTagName('osm')[0]?.children || [];
          if(els.length > 0) return xml;
        }catch(err){
          console.warn('Errore fetch da', base, err);
        }
      }
      throw new Error('Tutti i mirror Overpass hanno fallito (CORS / rate-limit / rete).');
    }

    // Prova in ordine node → way → relation
    async function detectType(id){
      const types = ['node', 'way', 'relation'];
      for(const t of types){
        const q = buildQuery(t, id);
        try{
          const xml = await tryFetchOverpass(q);
          const els = xml.getElementsByTagName(t);
          if(els && els.length > 0) return { xml, type: t };
        }catch{}
      }
      throw new Error('ID non trovato come node, way o relation.');
    }

    go.addEventListener('click', async ()=>{
      const id = idEl.value.trim();
      if(!/^[0-9]+$/.test(id)){
        outEl.textContent = 'ID non valido — inserisci solo cifre.';
        return;
      }

      outEl.textContent = 'Rilevamento automatico tipo...';
      typeInfo.textContent = '';

      try{
        const { xml, type } = await detectType(id);
        const geojson = osmtogeojson(xml);
        outEl.textContent = JSON.stringify(geojson, null, 2);
        typeInfo.textContent = `Tipo rilevato: ${type}`;

        if(geoLayer) map.removeLayer(geoLayer);
        geoLayer = L.geoJSON(geojson, {
          style: { color: '#0074D9', weight: 2 },
          pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 5, color: '#FF4136' })
        }).addTo(map);

        try {
          map.fitBounds(geoLayer.getBounds(), { maxZoom: 15 });
        } catch(e) {
          console.warn('Non è stato possibile centrare la mappa (probabile nodo singolo)', e);
        }
      }catch(err){
        outEl.textContent = 'Errore: ' + err.message;
      }
    });

    copyBtn.addEventListener('click', async ()=>{
      const text = outEl.textContent;
      if(!text || text.startsWith('Nessuna') || text.startsWith('Errore')){
        copyBtn.textContent = '⚠️ Vuoto';
        setTimeout(()=> copyBtn.textContent = '📋 Copia', 1500);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = '✅ Copiato!';
        setTimeout(()=> copyBtn.textContent = '📋 Copia', 1500);
      } catch(e) {
        alert('Errore nel copiare il testo.');
      }
    });
  </script>
</body>
</html>
